{% set name = "shinywidgets" %}
{% set version = "0.8.2" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/shinywidgets-{{ version }}.tar.gz
  sha256: 404307860a398c07854fc3cef018d0c628d036902d78e5f56643492e987e8f5d

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - hatchling >=1.26.0
    - hatch-vcs >=0.4.0
    - pip
  run:
    - python >={{ python_min }}
    - anywidget
    - ipywidgets >=7.6.5
    - jupyter_core
    - shiny >=0.6.1.9005
    - python-dateutil >=2.8.2

test:
  imports:
    - shinywidgets
  # commands:
    # broken by py-shiny feedstock
    # - pip check
  requires:
    - python {{ python_min }}
    - pip

about:
  home: https://github.com/posit-dev/py-shinywidgets
  summary: Render ipywidgets in Shiny applications
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - cpsievert
    - schloerke
    - daylinmorgan
